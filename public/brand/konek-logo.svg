<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Konek">
  <defs>
    <linearGradient id="knk-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6CB6B"/>
      <stop offset="1" stop-color="#D98A24"/>
    </linearGradient>
    <linearGradient id="knk-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34A873"/>
      <stop offset="1" stop-color="#0B6B45"/>
    </linearGradient>
  </defs>

  <!-- connectivity waves rising from the chip -->
  <g fill="none" stroke="url(#knk-gold)" stroke-width="2.4" stroke-linecap="round">
    <path d="M13 13 a10 10 0 0 1 10 -4"/>
    <path d="M14.5 18 a6.5 6.5 0 0 1 6.5 -2.6"/>
  </g>

  <!-- K lower leg (green) -->
  <path d="M23 34 L45 53 L52 53 L30 33 Z" fill="url(#knk-green)"/>
  <!-- K upper arm (gold) -->
  <path d="M23 34 L45 15 L52 15 L30 35 Z" fill="url(#knk-gold)"/>

  <!-- K stem -->
  <rect x="16" y="24" width="9" height="28" rx="2" fill="#132019"/>
  <!-- SIM chip forming the head of the stem -->
  <rect x="14" y="22" width="13" height="12" rx="3" fill="url(#knk-gold)"/>
  <g stroke="#132019" stroke-width="1.4" stroke-linecap="round">
    <path d="M20.5 22 V34"/>
    <path d="M14 28 H27"/>
  </g>

  <!-- speed accents on the leg -->
  <g stroke="url(#knk-gold)" stroke-width="2" stroke-linecap="round">
    <path d="M31 50 h6.5"/>
    <path d="M34 46 h6.5"/>
  </g>
</svg>
